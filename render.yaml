services:
  - type: web
    name: samastha-smart-tourism
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        sync: false
        placeholder: "Your Supabase URL"
      - key: SUPABASE_ANON_KEY
        sync: false
        placeholder: "Your Supabase Anon Key"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        placeholder: "Your Supabase Service Role Key"
